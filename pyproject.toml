[project]
name = "property-surveyor-receptionist"
version = "0.1.0"
description = "Code-managed Pipecat Cloud receptionist for a property surveyor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.13,<4",
    "pipecat-ai[daily,deepgram,openrouter,runner,silero]>=1.4,<2",
    "pipecatcloud>=0.3,<1",
    "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "PERF", "ISC", "RUF", "S"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["bot.py", "receptionist", "scripts", "tests"]
reportMissingTypeStubs = false
